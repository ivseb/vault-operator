name: Sync to vault-operator (public)

on:
  push:
    branches: [main]

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # FIX-28-04 (AUDIT 2026-07-14 Codex H-3): actions pinned to full commit SHAs.
      - name: Checkout main
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      # FIX-28-04: verified lockfile via `npm ci --ignore-scripts` instead of
      # discarding it and running `npm install` with lifecycle scripts.
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          # .npmrc `omit=optional` skips the platform binaries esbuild/rollup
          # need, so install them explicitly (pinned to the lockfile versions).
          npm install @rollup/rollup-linux-x64-gnu@4.62.2 --no-audit --no-fund --no-save --ignore-scripts
          npm install @esbuild/linux-x64@0.28.1 --no-audit --no-fund --no-save --ignore-scripts

      - name: Remove internal files
        run: |
          # Internal directories — must not appear in the public repo
          # (docs/ stays — needed for GitHub Pages)
          # Save public workflows before removing .github
          cp .github/workflows/release.yml /tmp/release.yml 2>/dev/null || true
          cp .github/workflows/deploy-pages.yml /tmp/deploy-pages.yml 2>/dev/null || true

          # pro-skills: monetized Pro skills, must NOT ship in the public
          # plugin bundle. Stripped here so esbuild on the public repo
          # builds without them; the private repo keeps the catalog source.
          for dir in _devprocess .github scripts _global _memory pro-skills; do
            git rm -rf --cached "$dir" 2>/dev/null || true
            rm -rf "$dir"
          done

          # Restore public workflows
          mkdir -p .github/workflows
          cp /tmp/release.yml .github/workflows/release.yml 2>/dev/null || true
          cp /tmp/deploy-pages.yml .github/workflows/deploy-pages.yml 2>/dev/null || true
          git add .github/workflows/ 2>/dev/null || true

          # Internal files
          git rm -f --cached CLAUDE.md 2>/dev/null || true
          rm -f CLAUDE.md

      - name: Rebuild bundle without pro-skills (M-1, AUDIT 2026-07-08)
        run: |
          # The tracked main.js was built privately WITH the monetized
          # pro-skills inlined (esbuild bundles pro-skills/). Stripping only
          # the source dir above would still force-push that bundle, leaking
          # the premium prompt text into the public mirror. Rebuild here from
          # the stripped tree so pro-skills/ is absent from PRO_SKILLS; the
          # vault-deploy step self-skips (no PLUGIN_DIR in CI).
          node esbuild.config.mjs production
          git add -f main.js styles.css manifest.json

      - name: Fail closed if premium content leaked into the bundle
        run: |
          # Defense in depth: a future change must never re-introduce the leak.
          if grep -Fq 'Compact summary of a transcript' main.js; then
            echo "::error::pro-skills prompt text found in public main.js -- aborting public sync (see AUDIT-2026-07-08 M-1)"
            exit 1
          fi

      - name: Commit filtered state
        run: |
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          if ! git diff --cached --quiet; then
            git commit -m "chore: strip internal files for public mirror [skip ci]"
          fi

      - name: Push to vault-operator
        env:
          TOKEN: ${{ secrets.OBSILO_PUBLIC_TOKEN }}
        run: |
          git remote add vault-operator "https://x-access-token:${TOKEN}@github.com/pssah4/vault-operator.git"
          git push vault-operator HEAD:main --force
